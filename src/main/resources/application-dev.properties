server.port=8080

# DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/foods_drinks?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=9000000

# SPRINGDOC / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# THYMELEAF
spring.thymeleaf.cache=false

# FILE UPLOAD
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# LOGGING
logging.level.com.example.foodsdrinks=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG

# Mail - Mailtrap (dev only)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=noreply@foodsdrinks.dev

# Slack
app.slack.webhook-url=${SLACK_WEBHOOK_URL}

# Actuator
management.endpoints.web.exposure.include=health,metrics,circuitbreakers,ratelimiters,info,scheduledtasks
management.endpoint.health.show-details=always

# Social Login
app.google.client-id=${GOOGLE_CLIENT_ID}
app.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI}

# Resilience4j ? Circuit Breaker (Google token verification)
resilience4j.circuitbreaker.instances.googleTokenVerify.register-health-indicator=true
resilience4j.circuitbreaker.instances.googleTokenVerify.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.googleTokenVerify.sliding-window-size=10
resilience4j.circuitbreaker.instances.googleTokenVerify.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.googleTokenVerify.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.googleTokenVerify.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.googleTokenVerify.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.googleTokenVerify.record-exceptions=org.springframework.web.client.ResourceAccessException

# Resilience4j ? Rate Limiter (social-login inbound protection)
resilience4j.ratelimiter.instances.socialLogin.limit-for-period=10
resilience4j.ratelimiter.instances.socialLogin.limit-refresh-period=60s
resilience4j.ratelimiter.instances.socialLogin.timeout-duration=0
resilience4j.ratelimiter.instances.socialLogin.register-health-indicator=true
