<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}">
<head>
    <title th:text="#{admin.suggestions.title}">Suggestions</title>
</head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0"><i class="bi bi-lightbulb me-2"></i><span th:text="#{admin.suggestions.title}">Suggestions</span></h4>
    </div>

    <!-- Filter Form -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form th:action="@{/admin/suggestions}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small text-muted" th:text="#{admin.suggestions.filter.status}">Status</label>
                    <select name="status" class="form-select">
                        <option value="" th:selected="${selectedStatus == null}" th:text="#{admin.suggestions.filter.status.all}">All Statuses</option>
                        <option th:each="s : ${statusOptions}"
                                th:value="${s.name()}"
                                th:text="${s.name()}"
                                th:selected="${selectedStatus == s}"></option>
                    </select>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-search me-1"></i><span th:text="#{admin.common.search}">Search</span>
                    </button>
                    <a th:href="@{/admin/suggestions}" class="btn btn-outline-secondary w-100" th:text="#{admin.common.reset}">Reset</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-dark">
                <tr>
                    <th class="ps-3">#</th>
                    <th th:text="#{admin.suggestions.table.userEmail}">User Email</th>
                    <th th:text="#{admin.suggestions.table.name}">Name</th>
                    <th th:text="#{admin.suggestions.table.classify}">Classify</th>
                    <th th:text="#{admin.suggestions.table.status}">Status</th>
                    <th th:text="#{admin.suggestions.table.createdAt}">Created At</th>
                    <th class="text-center" th:text="#{admin.suggestions.table.actions}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${suggestions.isEmpty()}">
                    <td colspan="7" class="text-center text-muted py-4" th:text="#{admin.suggestions.empty}">No suggestions found.</td>
                </tr>
                <tr th:each="suggestion, stat : ${suggestions.content}">
                    <td class="ps-3" th:text="${suggestions.number * suggestions.size + stat.index + 1}"></td>
                    <td th:text="${suggestion.user.email}"></td>
                    <td th:text="${suggestion.name}"></td>
                    <td th:text="${suggestion.classify != null ? suggestion.classify.name() : '—'}"></td>
                    <td>
                        <span th:classappend="${
                            suggestion.status.name() == 'PENDING'  ? 'bg-warning text-dark' :
                            suggestion.status.name() == 'APPROVED' ? 'bg-success' :
                            'bg-danger'}"
                              class="badge"
                              th:text="${suggestion.status.name()}"></span>
                    </td>
                    <td th:text="${#temporals.format(suggestion.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="text-center">
                        <a th:href="@{/admin/suggestions/{id}(id=${suggestion.id})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-eye me-1"></i><span th:text="#{admin.suggestions.action.view}">View</span>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="card-footer bg-white border-0" th:if="${suggestions.totalPages > 1}">
            <nav>
                <ul class="pagination pagination-sm mb-0 justify-content-center">
                    <li class="page-item" th:classappend="${suggestions.first ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/admin/suggestions(page=${suggestions.number - 1}, size=${suggestions.size}, status=${selectedStatus})}">&laquo;</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, suggestions.totalPages - 1)}"
                        th:classappend="${i == suggestions.number ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/admin/suggestions(page=${i}, size=${suggestions.size}, status=${selectedStatus})}"
                           th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${suggestions.last ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/admin/suggestions(page=${suggestions.number + 1}, size=${suggestions.size}, status=${selectedStatus})}">&raquo;</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</div>
</body>
</html>
